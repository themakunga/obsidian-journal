version: "0.2"
language: en
useGitignore: true

dictionaries:
  - en_US
  - softwareTerms
  - misc
  - filetypes
  - python
  - bash
  - lua

ignorePaths:
  - .git/**
  - templates/**

words:
  - commitlint
  - frontmatter
  - luacheck
  - luajit
  - luarocks
  - markdownlint
  - Neovim
  - nixpkgs
  - prettierd
  - rollups
  - secondhost
  - TheMakunga
  - Villarroel
  - Taplo
  - taplo
