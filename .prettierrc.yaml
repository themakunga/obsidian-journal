overrides:
  - files: "*.hbs"
    options:
      parser: glimmer
      tabWidth: 2
      useTabs: false
  - files: "*.lua"
    options:
      plugins: ["@prettier/plugin-lua"]
  - files: "*.sh"
    options:
      plugins: [prettier-plugin-sh]
  - files: "*.toml"
    options:
      plugins: [prettier-plugin-toml]
  - files: "*.json"
    options:
      tabWidth: 2
  - files: "*.md"
    options:
      printWidth: 80
      tabWidth: 2
      useTabs: false
      proseWrap: always
      embeddedLanguageFormatting: "off"
